name: CI Pipeline — 单人全栈架构 v1.0 四道防线

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ──────────────────────────────────────────────────────────
  # 防线 01: 静态类型与代码合规
  # ──────────────────────────────────────────────────────────
  type-check:
    name: "Gate 01: TypeScript Type Check"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npx vue-tsc --noEmit
        continue-on-error: false

  # ──────────────────────────────────────────────────────────
  # 防线 02: API 安全越权自动化测试
  # ──────────────────────────────────────────────────────────
  api-safety:
    name: "Gate 02: API Safety Check"
    runs-on: ubuntu-latest
    needs: type-check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Build project
        run: npm run build
      - name: Start server in background
        run: |
          MOCK_DB=true node .output/server/index.mjs &
          sleep 5
      - name: Run API safety tests
        run: npm run test:api-safety

  # ──────────────────────────────────────────────────────────
  # 防线 03: Supabase RLS 安全检查 (需要 Supabase CLI)
  # ──────────────────────────────────────────────────────────
  rls-check:
    name: "Gate 03: Supabase RLS Lint"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify migration files exist
        run: |
          if [ ! -d "supabase/migrations" ]; then
            echo "ERROR: supabase/migrations/ directory not found"
            exit 1
          fi
          if [ -z "$(ls -A supabase/migrations/*.sql 2>/dev/null)" ]; then
            echo "ERROR: No SQL migration files found"
            exit 1
          fi
          echo "Migration files found:"
          ls -la supabase/migrations/*.sql
      - name: Check RLS is enabled in all CREATE TABLE statements
        run: |
          TABLES=$(grep -i 'CREATE TABLE' supabase/migrations/*.sql | grep -oP '"[^"]+"' | tr -d '"' | sort -u)
          for table in $TABLES; do
            if ! grep -qi "ALTER TABLE.*\"${table}\".*ENABLE ROW LEVEL SECURITY" supabase/migrations/*.sql; then
              echo "ERROR: RLS not enabled for table: $table"
              exit 1
            fi
          done
          echo "All tables have RLS enabled."

  # ──────────────────────────────────────────────────────────
  # 防线 04: Web Vitals 性能门禁 (仅前台页面变更触发)
  # ──────────────────────────────────────────────────────────
  lighthouse:
    name: "Gate 04: Lighthouse Performance"
    runs-on: ubuntu-latest
    needs: type-check
    if: |
      contains(github.event.pull_request.changed_files_url, 'client') ||
      contains(github.event.pull_request.changed_files_url, 'h5')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - name: Start server
        run: |
          MOCK_DB=true node .output/server/index.mjs &
          sleep 5
      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v11
        with:
          urls: |
            http://localhost:3000/
            http://localhost:3000/tasks
          uploadArtifacts: true
          temporaryPublicStorage: true
